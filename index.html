<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Learn to code JavaScript through a text-based dungeon crawler adventure">
    <title>Dungeon Crawler Carl</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div class="container">
        <!-- Title Bar -->
        <header class="title-bar">
            <h1>🏰 Dungeon Crawler Carl - Learn JavaScript by Coding</h1>
        </header>
        
        <!-- Lessons Button -->
        <div class="lessons-button-container">
            <button id="lessonsButton" class="btn-lessons">📚 Lessons</button>
        </div>
        
        <!-- Map Button -->
        <div class="map-button-container">
            <button id="mapButton" class="btn-map">🗺️ Dungeon Map</button>
        </div>

        <!-- Code Editor Section -->
        <section class="code-section">
            <h2>Code Challenge</h2>
            <div class="code-editor-wrapper">
                <textarea id="codeEditor" class="code-editor" placeholder="// Write your JavaScript code here to solve the challenge..."></textarea>
                <button id="runCode" class="btn-run">Run Code ▶</button>
            </div>
        </section>

        <!-- Gameplay Text Area -->
        <section class="gameplay-section">
            <h2>Adventure Log</h2>
            <div id="gameplayText" class="gameplay-text"></div>
        </section>

        <!-- Terminal Section -->
        <section class="terminal-section">
            <h2>Terminal</h2>
            <div id="terminal" class="terminal-output"></div>
            <div class="terminal-controls">
                <button id="sendCommand" class="btn-terminal">Send Command 📨</button>
            </div>
            <div class="terminal-input-wrapper">
                <span class="terminal-prompt">$ </span>
                <input type="text" id="terminalInput" class="terminal-input" placeholder="Type commands (help, cd, sudo, hint, inventory)..." autocomplete="off">
            </div>
        </section>
    </div>
    
    <!-- Help Modal -->
    <div id="helpModal" class="help-modal">
        <div class="help-modal-content">
            <div class="help-header">
                <h2>📖 How to Play Dungeon Crawler Carl</h2>
                <button id="closeHelp" class="btn-close-help">✕</button>
            </div>
            <div class="help-body" id="helpBody">
                <!-- Help content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Map Modal -->
    <div id="mapModal" class="map-modal">
        <div class="map-modal-content">
            <div class="map-header">
                <h2>🗺️ Dungeon Map</h2>
                <button id="closeMap" class="btn-close-map">✕</button>
            </div>
            <canvas id="mapCanvas" width="600" height="500"></canvas>
            <div class="map-legend">
                <h3>Legend:</h3>
                <div class="legend-items">
                    <div class="legend-item">
                        <span class="legend-symbol player-symbol">+</span>
                        <span>Your Position</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol">○</span>
                        <span>Visibility Range (10m)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol door-locked">●</span>
                        <span>Locked Door</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol door-unlocked">●</span>
                        <span>Unlocked Door</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol enemy-symbol">+</span>
                        <span>Enemy</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol npc-symbol">+</span>
                        <span>NPC</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="save-manager.js"></script>
    <script src="ui-components.js"></script>
    <script src="game.js"></script>
    <script src="map.js"></script>
    <script src="terminal.js"></script>
    <script src="app.js"></script>
</body>
</html>
