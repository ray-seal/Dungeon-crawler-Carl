<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Learn JavaScript coding concepts step by step">
    <title>Lesson - Dungeon Crawler Carl</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lesson-view.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div class="lessons-container">
        <!-- Title Bar -->
        <header class="title-bar">
            <h1>📚 Dungeon Crawler Carl - Lesson</h1>
            <button id="backToLessons" class="btn-back">← Back to Lessons</button>
        </header>

        <!-- Lesson Content -->
        <section class="lesson-content">
            <div id="lessonTitle" class="lesson-title"></div>
            
            <!-- Explanation Section -->
            <div class="lesson-section">
                <h2>📖 What You'll Learn</h2>
                <div id="lessonExplanation" class="lesson-explanation"></div>
            </div>

            <!-- Questions Section -->
            <div class="lesson-section">
                <div class="question-header">
                    <h2>❓ Questions</h2>
                    <div id="questionCounter" class="question-counter"></div>
                </div>
                
                <!-- Question Container -->
                <div id="questionContainer" class="question-container"></div>
                
                <!-- Check Answer Button -->
                <button id="checkAnswer" class="btn-check">Check Answer</button>
                
                <!-- Result Message -->
                <div id="questionResult" class="result-message"></div>

                <!-- Question Navigation -->
                <div class="question-navigation">
                    <button id="prevQuestion" class="btn-question-nav">← Previous</button>
                    <button id="nextQuestion" class="btn-question-nav">Next →</button>
                </div>
            </div>

            <!-- Lesson Navigation -->
            <div class="lesson-navigation">
                <button id="prevLesson" class="btn-nav">← Previous Lesson</button>
                <button id="nextLesson" class="btn-nav">Next Lesson →</button>
            </div>
        </section>

        <!-- Lesson List Sidebar -->
        <aside class="lesson-sidebar">
            <h2>Available Lessons</h2>
            <div id="lessonList" class="lesson-list"></div>
        </aside>
    </div>

    <script src="save-manager.js"></script>
    <script src="lesson-data.js"></script>
    <script src="lesson-view.js"></script>
</body>
</html>
