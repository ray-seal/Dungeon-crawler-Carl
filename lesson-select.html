<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Choose a JavaScript lesson to learn">
    <title>Select a Lesson - Dungeon Crawler Carl</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lesson-select.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div class="lesson-select-container">
        <!-- Title Bar -->
        <header class="title-bar">
            <h1>📚 Dungeon Crawler Carl - Choose Your Lesson</h1>
            <button id="backToGame" class="btn-back">← Back to Game</button>
        </header>

        <!-- Lesson Selection Grid -->
        <main class="lesson-grid-container">
            <div class="intro-section">
                <h2>🎓 Learn JavaScript Step by Step</h2>
                <p>Select a lesson below to start learning. Each lesson includes explanations, fill-in-the-blank exercises, and hands-on coding practice.</p>
            </div>
            
            <div id="lessonGrid" class="lesson-grid"></div>
        </main>
    </div>

    <script src="save-manager.js"></script>
    <script src="lesson-data.js"></script>
    <script src="lesson-select.js"></script>
</body>
</html>
